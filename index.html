<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Compass</title>
<style>
html,body{margin:0;height:100%;background:#111;color:#eee;font-family:sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden}
#h{font-size:20vmin;font-weight:700;line-height:1}
#c{font-size:8vmin;margin:1vmin 0 3vmin}
#w{position:relative;width:80vmin;height:80vmin}
#w:before{content:"";position:absolute;left:50%;top:-3vmin;margin-left:-2.5vmin;border:2.5vmin solid transparent;border-top:4vmin solid #fc0;border-bottom:0}
svg{width:100%;height:100%;transition:transform .1s linear}
#b{font-size:6vmin;padding:2vmin 6vmin;margin:2vmin;display:none}
p{font-size:3.5vmin;color:#888;margin:3vmin 0 0}
</style>
<div id="h">--</div>
<div id="c"></div>
<div id="w"><svg id="d" viewBox="-100 -100 200 200" fill="#ccc" stroke="#ccc" text-anchor="middle"></svg></div>
<button id="b">開始</button>
<p>精度低下時は端末を8の字に動作</p>
<script>
var $=function(i){return document.getElementById(i)},r=0,p=null,T,s='',D=DeviceOrientationEvent,
N=['N','NE','E','SE','S','SW','W','NW'];
for(var i=0;i<36;i++){var a=i*10,k=a%30<1;
s+='<g transform="rotate('+a+')"><line y1="-96" y2="'+(k?-88:-92)+'"/>'+
(k?'<text y="-80" font-size="7" stroke="none">'+a+'</text>':'')+
(a%90<1?'<text y="-60" font-size="16" stroke="none"'+(a?'':' fill="#f33"')+'>'+'NESW'[a/90]+'</text>':'')+'</g>'}
$('d').innerHTML=s;
function f(e){var h=e.webkitCompassHeading;
if(h==null){if(e.alpha==null)return;h=360-e.alpha}
clearTimeout(T);
h=((h+(screen.orientation?screen.orientation.angle:0))%360+360)%360;
if(p!=null)r+=((h-p+540)%360)-180;else r=h;
p=h;
$('d').style.transform='rotate('+-r+'deg)';
$('h').textContent=(Math.round(h)%360)+'°';
$('c').textContent=N[Math.round(h/45)%8]}
function g(){addEventListener('ondeviceorientationabsolute' in window?'deviceorientationabsolute':'deviceorientation',f);
T=setTimeout(function(){$('h').textContent='センサー未検出';$('h').style.fontSize='8vmin'},2000)}
if(D&&D.requestPermission){var b=$('b');b.style.display='block';
b.onclick=function(){D.requestPermission().then(function(x){if(x=='granted'){b.style.display='none';g()}})}}
else g()
</script>
